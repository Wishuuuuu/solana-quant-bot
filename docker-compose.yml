version: '3.8'

services:
  # Redis for message queue and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # PostgreSQL for persistent data
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: solana_quant
      POSTGRES_USER: solana_user
      POSTGRES_PASSWORD: solana_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  # Smart Money Radar
  smart-money-radar:
    build:
      context: .
      dockerfile: Dockerfile.radar
    environment:
      - RPC_URL=${RPC_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # AI Sentiment Engine
  ai-sentiment-engine:
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      - REDIS_URL=redis://redis:6379
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Execution Engine
  execution-engine:
    build:
      context: .
      dockerfile: Dockerfile.execution
    environment:
      - RPC_URL=${RPC_URL}
      - REDIS_URL=redis://redis:6379
      - WALLET_PATH=/app/config/wallet.json
      - PAPER_TRADING=${PAPER_TRADING:-false}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs

  # Risk Manager
  risk-manager:
    build:
      context: .
      dockerfile: Dockerfile.risk
    environment:
      - RPC_URL=${RPC_URL}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://solana_user:solana_password@postgres:5432/solana_quant
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Price Oracle
  price-oracle:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Dashboard API
  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      - DATABASE_URL=postgresql://solana_user:solana_password@postgres:5432/solana_quant
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Health Checker
  health-checker:
    build:
      context: .
      dockerfile: Dockerfile.health
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://solana_user:solana_password@postgres:5432/solana_quant
    depends_on:
      - redis
      - postgres
      - dashboard-api
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Notifications Service
  notifications:
    build:
      context: .
      dockerfile: Dockerfile.notifications
    environment:
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  redis_data:
  postgres_data:
