[workspace]
members = [
    "shared",
    "smart-money-radar",
    "execution-engine",
    "risk-manager",
    "orchestrator",
    "jupiter-integration",
    "price-oracle",
    "notifications",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
solana-sdk = "1.18.26"
solana-client = "1.18.26"
solana-account-decoder = "1.18.26"
solana-transaction-status = "1.18.26"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
redis = "0.24"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
bs58 = "0.5"
anchor-lang = "0.29"
anchor-client = "0.29"
bincode = "1.3"
dashmap = "5.5"
async-trait = "0.1"
toml = "0.8"
rand = "0.8"
tokio-cron-scheduler = "0.10"
